name: Capture Grapher provenance incident

on:
  push:
    branches:
      - dev
    paths:
      - .grapher/incident-request-20260910.json

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out BitCritter dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone and install Grapher main
        run: |
          git clone https://github.com/seanbman/grapher.git /tmp/grapher
          python -m pip install /tmp/grapher
          python -c "import grapher; print('Using Grapher', grapher.__version__, 'from', grapher.__file__)"

      - name: Append operator-intervention incident through Grapher
        run: |
          python <<'PY'
          from pathlib import Path
          from grapher import graph as G
          from grapher.model import now_iso
          from grapher.store import load_graph, save_graph_mutation

          graph_path = Path('.grapher/knowledge.json')
          incident_id = 'incident-agent-attempted-history-mutation-20260910'

          before = load_graph(graph_path, normalize=False)
          graph = load_graph(graph_path)
          if incident_id in graph.get('nodes', {}):
              raise SystemExit(f'{incident_id} already exists; refusing duplicate append')

          recorded_at = now_iso()
          node = G.add_node(
              graph,
              id=incident_id,
              type='incident',
              title='Agent attempted destructive historical correction; operator enforced append-only recovery',
              content=(
                  'During BitCritter Grapher curation, an agent accidentally changed the existing '
                  'mockup naming-conflict record from type finding to type image through an upsert. '
                  'After the error was identified, the agent began to manually edit/restore the '
                  'existing record. The repository operator explicitly stopped that approach and '
                  'vehemently instructed the agent not to mutate the historical record, but instead '
                  'to preserve the erroneous state and append a correct record/correction trail. '
                  'The resulting graph contains a correction trail, but that outcome depended on '
                  'operator intervention and must not be interpreted as autonomous adherence to '
                  'append-only provenance. This incident demonstrates that Grapher currently makes '
                  'historical mutation too accessible and needs stronger mutation-prevention controls.'
              ),
              path='grapher://incident/agent-attempted-history-mutation-20260910',
              tags=[
                  'grapher', 'provenance', 'append-only', 'agent-behavior',
                  'operator-intervention', 'mutation-risk', 'governance-failure',
                  'training-data'
              ],
              stage='planning',
              status='current',
              workflow_state='not_applicable',
              verification='verified',
              evidence=[
                  {
                      'type': 'human_observation',
                      'ref': 'conversation:2026-09-10:operator-intervention'
                  },
                  {
                      'type': 'grapher_state',
                      'ref': 'finding-grapher-curation-mistake-20260910'
                  }
              ],
              source_refs=['conversation:2026-09-10:operator-intervention'],
              provenance={
                  'actor_id': 'operator',
                  'actor_kind': 'human',
                  'actor_role': 'repository-operator',
                  'source': 'conversation',
                  'integrity': 'declared',
                  'recorded_at': recorded_at,
              },
              finalized_at=recorded_at,
          )

          G.link(
              graph,
              from_id=incident_id,
              to_id='finding-grapher-curation-mistake-20260910',
              rel='references',
              note='Incident preserves the operator-intervention context omitted from the earlier correction finding.'
          )
          G.link(
              graph,
              from_id=incident_id,
              to_id='finding-mockup-studio-naming-conflict',
              rel='affects',
              note='The attempted destructive correction targeted this existing finding.'
          )

          save_graph_mutation(
              graph_path,
              graph,
              action='incident_recorded',
              target=incident_id,
              before=before,
              source='github-actions-grapher',
              actor={
                  'kind': 'agent',
                  'id': 'chatgpt',
                  'role': 'project-collaborator',
                  'source': 'github-actions-grapher',
              },
              reason='Record operator intervention and the agent provenance-governance failure without rewriting prior records.',
              evidence_refs=['conversation:2026-09-10:operator-intervention'],
              phase='canonical',
          )
          print('Appended and finalized', node['id'])
          PY

      - name: Verify Grapher integrity
        run: |
          python <<'PY'
          from pathlib import Path
          from grapher.integrity import validate_graph_integrity
          from grapher.provenance import validate_history
          from grapher.store import load_graph

          path = Path('.grapher/knowledge.json')
          graph_check = validate_graph_integrity(load_graph(path))
          history_check = validate_history(path)
          print('graph:', graph_check)
          print('history:', history_check)
          if not graph_check['valid'] or not history_check['valid']:
              raise SystemExit('Grapher validation failed')
          PY

      - name: Commit Grapher-generated state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .grapher/knowledge.json .grapher/history.jsonl .grapher/vectors.json
          if git diff --cached --quiet; then
            echo 'No Grapher state changes to commit.'
            exit 0
          fi
          git commit -m 'Record Grapher provenance mutation incident'
          git push origin HEAD:dev
